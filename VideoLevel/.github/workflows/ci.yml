name: CI

on:
  push:
  pull_request:

jobs:
  hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      - name: Install native codec tool
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Install circuit dependencies
        run: npm --prefix circuits ci --ignore-scripts
      - name: Static Python check
        run: python -m compileall -q src benchmark
      - name: Build and test native realtime transport
        run: |
          cmake -S native -B native/build
          cmake --build native/build
          ctest --test-dir native/build --output-on-failure
      - name: Native relay FFmpeg integration
        run: python src/runtest/test_native_relay_ffmpeg.py
      - name: Circuit package contract
        run: npm --prefix circuits test
      - name: Security hardening regression tests
        run: python src/runtest/test_hardening.py
      - name: Lattice post-quantum contracts
        run: python src/runtest/test_lattice_pq_stack.py
      - name: Cost-guided matrix embedding contracts
        run: python src/runtest/test_cost_guided_matrix_embedding.py
      - name: Realtime Annex-B transport contracts
        run: python src/runtest/test_realtime_transport.py
      - name: Portable codec and FFmpeg integration test
        run: python src/runtest/test_ffmpeg_fixture.py
