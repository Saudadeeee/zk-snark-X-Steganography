name: VideoLevel lattice-ZK unit tests

# Runs the lattice-ZK and touched-module tests of VideoLevel/ on a clean
# checkout. No gitignored data is needed: tests that read local covers under
# VideoLevel/data/ are skipped (see VideoLevel/conftest.py); fixtures the tests
# need are synthesised with ffmpeg at run time.

on:
  push:
    paths:
      - "VideoLevel/**"
      - ".github/workflows/videolevel-latticezk.yml"
  pull_request:
    paths:
      - "VideoLevel/**"
      - ".github/workflows/videolevel-latticezk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videolevel-latticezk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: VideoLevel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VideoLevel/requirements.lock

      - name: Install ffmpeg (libx264 for synthesised fixtures)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Lattice-ZK and touched-module tests
        env:
          PYTHON: python
        run: sh scripts/run_unit_tests.sh --junit-xml test-results/latticezk-junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latticezk-junit
          path: VideoLevel/test-results/latticezk-junit.xml
          if-no-files-found: ignore
